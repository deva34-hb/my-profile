<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Devendra Patil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed,
                #ec4899
            );
        }

        .card {
            width: 400px;

            padding: 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .profile {
            width: 100px;
            height: 100px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #ec4899
            );

            color: white;

            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .welcome {
            color: #666;
            font-size: 17px;

            margin-bottom: 30px;
        }

        .info {
            text-align: left;

            margin-top: 20px;
        }

        .info-box {
            padding: 15px;

            margin: 12px 0;

            background: #f5f3ff;

            border-left: 5px solid #6d28d9;

            border-radius: 8px;
        }

        .label {
            color: #777;
            font-size: 13px;
        }

        .value {
            color: #222;
            font-size: 18px;
            font-weight: bold;

            margin-top: 5px;
        }

        .message {
            margin-top: 25px;

            padding: 15px;

            background: #ede9fe;

            color: #4c1d95;

            border-radius: 10px;

            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Profile Icon -->
        <div class="profile">
            DP
        </div>

        <h1>Welcome!</h1>

        <p class="welcome">
            Welcome to my personal web page.
        </p>

        <div class="info">

            <div class="info-box">
                <div class="label">Name</div>
                <div class="value">Devendra Patil</div>
            </div>

            <div class="info-box">
                <div class="label">Department</div>
                <div class="value">Computer</div>
            </div>

        </div>

        <div class="message">
            🎓 Hello everyone!  
            <br><br>
            I am happy to welcome you to my web page.
        </div>

    </div>

</body>
</html>
